<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tigroox Caps</title><style>
:root{--bg:#ecf0f3;--light:#fff;--dark:#cfd8e3;--ink:#181818}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}.bar{padding:10px;background:#d84333;color:#fff;text-align:center;font-size:10px;font-weight:bold;letter-spacing:.13em}.nav{height:80px;padding:0 5vw;display:flex;align-items:center;justify-content:space-between}.logo{width:170px;height:60px;object-fit:contain;background:#000}.shop{max-width:1280px;margin:auto;display:grid;grid-template-columns:1.1fr .9fr;gap:0;min-width:0}.gallery{padding:clamp(20px,5vw,66px);min-width:0}.photo{height:min(62vw,700px);border-radius:28px;overflow:hidden;position:relative;background:#e7e4df;box-shadow:12px 12px 26px #c7cdd5,-12px -12px 26px #fff}.photo img{width:100%;height:100%;object-fit:cover;transition:filter .3s}.tag{position:absolute;top:20px;left:20px;padding:9px 11px;background:#151515;color:white;font-size:10px;letter-spacing:.13em}.arrows{position:absolute;right:18px;bottom:18px;display:flex;gap:8px}.arrows button{width:42px;height:42px;border:0;border-radius:50%;background:#fff;font-size:18px;cursor:pointer}.thumbs{display:flex;gap:9px;overflow-x:auto;padding:15px 2px}.thumb{flex:0 0 70px;height:70px;border:2px solid transparent;border-radius:14px;padding:0;overflow:hidden;background:#fff;cursor:pointer}.thumb.active{border-color:#111}.thumb img{width:100%;height:100%;object-fit:cover}.info{padding:clamp(38px,7vw,95px) clamp(25px,6vw,80px)}.kicker{font-size:10px;font-weight:bold;letter-spacing:.16em}.info h1{font-size:clamp(48px,6vw,78px);line-height:.82;letter-spacing:-.09em;margin:24px 0}.price{font-weight:bold;font-size:18px}.desc{line-height:1.65;border-top:1px solid #c4c9ce;padding-top:22px;margin-top:28px}.colors{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.color{height:42px;border:2px solid transparent;cursor:pointer;position:relative}.color.active:after{content:'✓';color:#fff;position:absolute;inset:0;display:grid;place-items:center;font-weight:bold}.order{margin-top:34px;padding:25px;background:#fff;border-radius:24px;box-shadow:10px 10px 20px var(--dark),-10px -10px 20px var(--light)}.order h2{margin:0 0 18px;font-size:19px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.wide{grid-column:1/-1}.order input,.order textarea{width:100%;padding:13px;border:0;border-radius:12px;background:var(--bg);box-shadow:inset 4px 4px 8px var(--dark),inset -4px -4px 8px var(--light);font:12px Arial}.order textarea{height:70px}.btn-creuse{width:100%;height:62px;border:0;border-radius:20px;background:#111;color:#fff;font-size:12px;font-weight:bold;letter-spacing:.1em;cursor:pointer;margin-top:12px;box-shadow:inset 8px 8px 16px #000,inset -8px -8px 16px #353535}.btn-creuse:active{box-shadow:inset 12px 12px 20px #000,inset -12px -12px 20px #353535}.status{display:none;color:#16733d;font-size:12px}.footer{display:flex;align-items:center;justify-content:space-between;padding:30px 5vw;background:#111;color:#fff;font-size:10px;letter-spacing:.1em}.footer .logo{width:180px;height:64px}@media(max-width:760px){.nav{height:68px}.logo{width:132px;height:50px}.shop{display:block}.gallery{padding:22px}.photo{height:88vw;border-radius:22px}.info{padding:42px 28px}.grid{grid-template-columns:1fr}.wide{grid-column:auto}.footer{align-items:flex-start;flex-direction:column;gap:18px}.footer .logo{width:155px;height:55px}}
</style></head><body><div class="bar">LIVRAISON OFFERTE DES 75 EUR</div><header class="nav"><img class="logo" src="tigroox-caps-logo.png" alt="Tigroox Caps"><span>15 COLORIS</span></header><main class="shop"><section class="gallery"><div class="photo"><img id="hero" src="cap-hero.png" alt="Casquette Tigroox"><span class="tag" id="tag">NOIR</span><div class="arrows"><button id="prev">←</button><button id="next">→</button></div></div><div class="thumbs" id="thumbs"></div></section><section class="info"><p class="kicker">DROP 01 — 15 COLORIS</p><h1>CAP<br>ESSENTIAL</h1><p class="price">39 EUR</p><p class="desc">Casquette en coton twill premium, visiere courbee et fermeture ajustable.</p><p class="kicker">COULEUR — <span id="name">NOIR</span></p><div class="colors" id="colors"></div><form class="order" id="form"><h2>COMMANDER MAINTENANT</h2><div class="grid"><input required placeholder="Prenom et nom"><input required placeholder="Telephone"><input class="wide" required type="email" placeholder="Adresse e-mail"><input class="wide" required placeholder="Adresse de livraison"><textarea class="wide" placeholder="Ville et precisions"></textarea></div><button class="btn-creuse">ENVOYER MA COMMANDE — 39 EUR</button><p class="status" id="status">Merci, ta demande de commande est enregistree.</p></form></section></main><footer class="footer"><img class="logo" src="tigroox-caps-logo.png" alt="Tigroox Caps"><span>© 2026 TIGROOX CAPS</span></footer><script>
const c=[['Noir','#191919','none'],['Ivoire','#eee5d6','none'],['Sable','#c8ad86','sepia(.25)'],['Rouge','#a82322','sepia(1) saturate(4) hue-rotate(320deg)'],['Bordeaux','#5a1725','sepia(1) saturate(2) hue-rotate(290deg)'],['Orange','#d46525','sepia(1) saturate(3) hue-rotate(350deg)'],['Jaune','#d7b437','sepia(1) saturate(3) hue-rotate(10deg)'],['Vert foret','#254d38','sepia(1) saturate(2) hue-rotate(85deg)'],['Sauge','#82947d','sepia(.7) hue-rotate(75deg)'],['Bleu marine','#1c365b','sepia(1) saturate(2) hue-rotate(170deg)'],['Bleu ciel','#74a6c4','sepia(1) saturate(2) hue-rotate(150deg)'],['Violet','#59386e','sepia(1) saturate(2) hue-rotate(230deg)'],['Rose','#d28a9d','sepia(1) saturate(2) hue-rotate(280deg)'],['Gris','#8b8c8a','grayscale(1)'],['Blanc','#f7f5f0','brightness(1.35) contrast(.75)']];let i=0,h=document.querySelector('#hero'),ts=document.querySelector('#thumbs'),cs=document.querySelector('#colors');function set(n){i=(n+c.length)%c.length;let x=c[i];h.style.filter=x[2];tag.textContent=x[0].toUpperCase();name.textContent=x[0].toUpperCase();[...ts.children].forEach((a,j)=>a.classList.toggle('active',j==i));[...cs.children].forEach((a,j)=>a.classList.toggle('active',j==i))}c.forEach((x,n)=>{let t=document.createElement('button');t.className='thumb';t.innerHTML='<img src="cap-hero.png" style="filter:'+x[2]+'">';t.onclick=()=>set(n);ts.append(t);let b=document.createElement('button');b.className='color';b.style.background=x[1];b.onclick=()=>set(n);cs.append(b)});set(0);prev.onclick=()=>set(i-1);next.onclick=()=>set(i+1);form.onsubmit=e=>{e.preventDefault();status.style.display='block'};
</script></body></html>
